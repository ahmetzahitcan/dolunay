# The metadata of this testbench. pytb/run.py reads it to find the testbench
# and to work out what it is built from.
#
# The name it is selected by on the command line. It defaults to the name of
# the folder.
name = "core_middleend"

# What it is. It is shown in the list of the testbenches.
description = "the middle end: operand fetch, dispatch and the result stream"

# The HDL top module.
toplevel = "tb_core_middleend_cocotb"

# The Python module the tests are in. It is imported from this folder, which
# is put on the import path of the simulator.
module = "test_core_middleend"

# The files of the testbench itself, relative to this folder.
sources = ["tb_core_middleend_cocotb.sv"]

# The project's own files, relative to the project root, in the order
# Verilator needs them: the packages first, in dependency order, then the
# RTL. This is the middle end and the function units it has in it, and
# nothing else.
project_sources = [
    "src/params_pkg.sv",
    "src/control_unit_pkg.sv",
    "src/core_pkg.sv",
    "src/alu.sv",
    "src/control_unit.sv",
    "src/core_middleend.sv",
    "src/fuhelper_combinatorial.sv",
    "src/fu_bju.sv",
    "src/fu_csru.sv",
    "src/fu_fpnew.sv",
    "src/fu_lsu.sv",
    "src/fu_multialu.sv",
    "src/immediate_decoder.sv",
    "src/mem_read_formatter.sv",
    "src/mem_write_formatter.sv",
    "src/minmax_reducer.sv",
    "src/priority_encoder.sv",
    "src/ram.sv",
    "src/scratchpad.sv",
    "src/sim__instr_formatter.sv",
]

# The files of the Bender checkouts, matched by the end of their path. The
# middle end has the FPU in it, so it needs all of them.
bender_sources = [".sv"]
